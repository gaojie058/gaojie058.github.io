hero:
  title: "About Monash University"
  # Campus photo shown under the title. Delete this whole `image:` block to hide it.
  # If you swap the photo, keep a `credit:` line — this one is Creative Commons and
  # the attribution is what the licence requires. Do not drop in a photo from
  # monash.edu or a stock site without checking that you may republish it.
  image:
    src: /assets/images/monash/woodside-building.jpg
    credit: >-
      Photo by <a href="https://commons.wikimedia.org/wiki/File:Woodside_Building_for_Technology_and_Design,_Monash_University,_Clayton_campus.jpg" target="_blank">Monash Information Technology</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank">CC BY-SA 4.0</a>, via Wikimedia Commons.

sections:

  # ---- 01 -------------------------------------------------------------------
  - paragraphs:
      - >
        Monash University is a public research university in Melbourne, Australia, and a
        member of the <a href="https://go8.edu.au/" target="_blank">Group of Eight</a>, the
        country's research-intensive universities. It is ranked #31 globally in the 2027
        QS World University Rankings. On CSRankings it is #7 in HCI worldwide (2010-2026),
        and #1 in Australia in all four of AI, NLP, software engineering, and HCI.
    # A `tags:` list here renders a row of pills under the paragraph, each
    # {label, rank, link} with rank and link both optional. Left empty on
    # purpose: the per-area figures are already in the sentence above, and
    # linking each area to CSRankings does not work, since it overwrites the
    # region in a shared URL with the reader's own location.

  # ---- 02 -------------------------------------------------------------------
  - title: Interpretive Agentic AI Lab (IAA Lab)
    # Quiet aside beside the section title. Delete this line once the site is up.
    note: 
    paragraphs:
      - >
        IAA Lab studies how to support humans in performing interpretive work, including
        but not limited to agent behavior analysis, data analysis, and code comprehension.
        We are also open to other topics that align with your research interests.
      - >
        Students with HCI, NLP and SE backgrounds are strongly welcome. But we envision that
        IAA Lab will be an interdisciplinary and innovative team, so students with other strong
        backgrounds are also welcome to contact us.

  # ---- 03 -------------------------------------------------------------------
  - title: Open Positions
    # Plain text: `name` (with `when` inline beside it) over a paragraph.
    # Add a position by copying one block; delete one by removing it.
    roles:
      - name: Postdoctoral Researchers
        description: >
          There are two routes into a postdoc here. The first is a fellowship you hold
          yourself, which you apply for with me as your host and which pays your own salary.
          The second is a salaried position funded on a grant, advertised through
          <a href="https://careers.pageuppeople.com/513/cw/en/listing/" target="_blank">Monash Jobs</a>.
          Fellowship applications take months to prepare and Monash's internal deadline
          usually falls well before the funder's, so please write to me early rather than
          near the closing date.
        # The `when:` field is deliberately absent: the timing depends on grant funding.
        # Fill the todo below in with a real answer, or delete the whole `notes:` block
        # if you would rather not commit to a year on the page.
        notes:
          - title: Timing
            items:
              - "todo: say when a funded position is likely, and whether you would co-apply for a fellowship starting in 2027 or 2028."
        # Named schemes only, each linking to the funder's own page, which is where the
        # current rate, eligibility rule and closing date live. Same principle as the PhD
        # list below: this page does not restate numbers that go stale.
        funding:
          - title: Fellowships you apply for with me as host
            items:
              - '<a href="https://www.arc.gov.au/funding-research/arc-funding-schemes/discovery/discovery-early-career-researcher-award-decra" target="_blank">ARC Discovery Early Career Researcher Award (DECRA)</a>. Three years of salary plus project costs, for researchers within five years of their PhD. This is the main route in Australia, and it is open to any nationality.'
              - '<a href="https://www.arc.gov.au/early-career-industry-fellowships" target="_blank">ARC Early Career Industry Fellowship</a>. Three years split between the university and an industry partner. Paused as of mid-2026 pending the ARC funding policy review, so check the scheme page before planning around it.'
              - '<a href="https://marie-sklodowska-curie-actions.ec.europa.eu/actions/postdoctoral-fellowships" target="_blank">MSCA Global Postdoctoral Fellowship</a>. For researchers moving from Europe, this funds up to two years at Monash and then a year back at a European host.'
              - '<a href="https://www.fulbright.org.au/scholarships/fulbright-us-postdoctoral-scholarship/" target="_blank">Fulbright U.S. Postdoctoral Scholarship</a>. For US citizens, tenable at an Australian host institution.'
              - '<a href="https://www.veski.org.au/victoria-fellowships/" target="_blank">veski Victoria Fellowships</a>. A travel grant rather than a salary, for early career researchers already based in Victoria.'
              - If your own country funds outbound postdocs, such as JSPS, the Humboldt Foundation, or a national postdoctoral council, Monash can act as the overseas host. Tell me which scheme you have in mind and we can work out whether it fits.

      - name: PhD Students (1-2)
        when: Starting mid to late 2027 or early 2028
        description: >
          I will accept students via
          <a href="https://www.monash.edu/graduate-research/study/scholarships/fees-scholarships#ScholarshipsandgrantsforMonashAustralia" target="_blank">PhD scholarships</a>
          below. I may also be able to fund exceptionally strong students directly, depending on grant funding at the time. Please see
          <a href="https://www.monash.edu/graduate-research/study/apply#tabs__2347545-02" target="_blank">How to apply</a>
          and the
          <a href="https://publicpolicydms.monash.edu/Monash/documents/2723244" target="_blank">Graduate Research Admissions Procedure</a>.
          International students must also satisfy the
          <a href="https://www.monash.edu/graduate-research/study/apply/english-language-proficiency-requirements-for-admission" target="_blank">English language requirements</a>.
        # One labelled block holding the scholarship names, each linking to the Monash
        # page that carries the current rate and eligibility rules. Deliberately no
        # per-scheme blurb: the linked pages are authoritative and stay current, this
        # list does not. Drop a line to hide a scheme, or delete `funding:` for all.
        # Sir James McNeill is absent on purpose. It pays the same as the top two here
        # but is restricted to Arts (Music), Engineering, Medicine and Science, so IT
        # students are not eligible.
        funding:
          - title: Scholarships
            link: https://www.monash.edu/graduate-research/study/scholarships/fees-scholarships
            # Ordered by how likely a student is to actually receive one, not by size.
            # A single application is considered for every scheme automatically, so the
            # applicant never picks. CF-MGS leads because the enrolling faculty co-funds
            # it and the number offered varies with that budget, which gives the faculty
            # more room than the centrally funded schemes; it is still awarded on merit.
            # The last two are two awards a year across all of Monash, long shots for anyone.
            items:
              - '<a href="https://www.monash.edu/study/fees-scholarships/scholarships/find-a-scholarship/co-funded-monash-graduate-scholarship-cf-mgs#scholarship-details" target="_blank">Co-funded Monash Graduate Scholarship (CF-MGS)</a>'
              - '<a href="https://www.monash.edu/study/fees-scholarships/scholarships/find-a-scholarship/monash-graduate-scholarship-mgs" target="_blank">Monash Graduate Scholarship (MGS)</a>'
              - '<a href="https://www.monash.edu/study/fees-scholarships/scholarships/find-a-scholarship/research-training-program-scholarship#scholarship-details" target="_blank">Research Training Program (RTP) Stipend</a>'
              - '<a href="https://www.monash.edu/study/fees-scholarships/scholarships/find-a-scholarship/international-tuition-scholarship" target="_blank">Monash International Tuition Scholarship (MITS)</a>'
              - '<a href="https://www.monash.edu/study/fees-scholarships/scholarships/find-a-scholarship/maxwell-king-phd-scholarship" target="_blank">Maxwell King PhD Scholarship</a>'
              - '<a href="https://www.monash.edu/study/fees-scholarships/scholarships/find-a-scholarship/monash-graduate-impact-2030-scholarship" target="_blank">Monash Graduate Impact 2030 Scholarship</a>'
              # The full Monash list is not a line here: it hangs off "PhD scholarships"
              # in the sentence above, so this list stays a list of named schemes.
        # Admission requirements can go in a `notes:` list here. Same shape as
        # `funding:` (title, link, items), rendered above the scholarships.

      - name: Visiting Students
        description: >
          I personally benefited a lot from my own visiting experience, in which I learned
          other labs' research methods and gained access to their alumni networks. So IAA Lab
          will welcome visiting students. I also encourage our students to visit other
          labs in other countries, and to have one or more internships in industry or another
          research lab. This ensures our students are more competitive on the job market in
          their graduating year, whether they are looking for academic or industry positions.
          If you want to visit IAA Lab, please contact me.
      - name: Interns
        description: >
          We welcome interns both remotely and locally.

  # ---- 04 -------------------------------------------------------------------
  # What the university puts behind a person once they are here. Aimed mostly at
  # postdocs and fellowship applicants, though students get the compute and the
  # institute community too. Every line links to the page that owns the detail.
  - title: Research Support at Monash
    paragraphs:
      - >
        Whichever position you come in on, these are the things Monash puts behind you.
        They matter most for a fellowship application, where a host institution has to
        show it can actually support the work.
    list:
      - '<a href="https://docs.erc.monash.edu/Compute/HPC/M3/" target="_blank">MASSIVE M3</a>, the university HPC cluster, gives every Monash researcher access to hundreds of NVIDIA GPUs and a fast parallel file system, with partitions set aside for deep learning. Monash also holds shares in the national NCI and Pawsey facilities.'
      - '<a href="https://www.monash.edu/data-futures-institute" target="_blank">Monash AI Institute</a>, previously the Monash Data Futures Institute, runs seed grants for interdisciplinary AI and data science projects and is where a lot of the cross-faculty collaboration happens.'
      - 'The <a href="https://www.monash.edu/researchoffice/find-and-apply/find-funding" target="_blank">Monash Research Office</a> gives strategic advice and review on fellowship and grant applications, and subscribes to the Pivot-RP and Research Professional funding databases so you can find schemes you are eligible for.'
      - 'The <a href="https://www.monash.edu/ecr-induction/ecr-network" target="_blank">Early Career Researcher Network</a> runs mentoring, workshops and panels across the university, alongside the faculty and school level groups. The <a href="https://www.monash.edu/ecr-induction/home" target="_blank">ECR induction hub</a> is the starting point.'
      - 'The <a href="https://www.monash.edu/gender-equity/programs/aws-grants" target="_blank">Advancing Women''s Success Grant</a> covers costs that make academic work hard to sustain alongside caring responsibilities, and comes with access to career coaching.'
      - 'On visas, Monash sponsors work visas for staff it hires. Researchers with a strong international record can also apply for the <a href="https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/national-innovation-visa-858" target="_blank">National Innovation visa</a>, a permanent residency route that replaced the Global Talent visa in December 2024.'

  # ---- 05 -------------------------------------------------------------------
  - title: How to Reach Out
    # `callout` renders inside the shaded box. Use `paragraphs` instead for plain text.
    callout:
      paragraphs:
        - "When you email me, please include:"
      list:
        - Your CV.
        - Which position you are interested in, and when you would want to start.
        - >
          A short paragraph on what you want to work on and why it connects to the lab.
