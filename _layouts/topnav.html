<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ page.title }} - {{ site.data.profile.navbar_name }}</title>

    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css" integrity="sha512-P5MgMn1jBN01asBgU0z60Qk4QxiXo86+wlFahKrsQf37c9cro517WzVSPPV1tDKzhku2iJ2FVgL67wG03SGnNA==" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.1/css/academicons.min.css" integrity="sha512-b1ASx0WHgVFL5ZQhTgiPWX+68KjS38Jk87jg7pe+qC7q9YkEtFq0z7xCglv7qGIs/68d3mAp+StfC8WKC5SSAg==" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
    <style>
    /* ===== Topnav layout ===== */
    body.topnav-layout { padding-top: 0 !important; background: #fff; }

    .topnav-bar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: saturate(180%) blur(14px);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
        border-bottom: 1px solid var(--color-border);
    }
    .topnav-inner {
        max-width: 1080px;
        margin: 0 auto;
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
    }
    .topnav-brand {
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: 1.05rem;
        letter-spacing: 0.01em;
        color: var(--color-text);
        text-decoration: none;
    }
    .topnav-brand:hover { color: var(--color-accent); text-decoration: none; }
    .topnav-links {
        display: flex;
        align-items: center;
        gap: 1.8rem;
    }
    .topnav-link {
        color: var(--color-text);
        font-size: 0.95rem;
        letter-spacing: 0.01em;
        text-decoration: none;
        padding: 0.2rem 0;
        border-bottom: 1.5px solid transparent;
        transition: color 0.15s, border-color 0.15s;
    }
    .topnav-link:hover { color: #1d4e9e; text-decoration: none; border-bottom-color: #1d4e9e; }
    .topnav-link.active { color: #1d4e9e; border-bottom-color: #1d4e9e; }

    .topnav-mobile-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 1.2rem;
        color: var(--color-text);
        cursor: pointer;
    }
    @media (max-width: 768px) {
        .topnav-inner { padding: 0.8rem 1.2rem; }
        .topnav-links {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
            background: #fff;
            border-bottom: 1px solid var(--color-border);
            padding: 0.5rem 1.2rem 1rem;
        }
        .topnav-links.open { display: flex; }
        .topnav-link { padding: 0.6rem 0; width: 100%; border-bottom: none; }
        .topnav-mobile-toggle { display: block; }
    }

    .topnav-main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 3.5rem 2rem 2rem;
    }
    @media (max-width: 768px) {
        .topnav-main { padding: 2rem 1.2rem 1rem; }
    }
    </style>
</head>
<body class="topnav-layout">

<!-- Top navigation -->
<header class="topnav-bar">
    <div class="topnav-inner">
        <a class="topnav-brand" href="{{ '/' | relative_url }}">{{ site.data.profile.navbar_name }}</a>
        <button class="topnav-mobile-toggle" onclick="document.getElementById('topnav-links').classList.toggle('open')" aria-label="Toggle menu">
            <i class="fas fa-bars"></i>
        </button>
        <nav class="topnav-links" id="topnav-links">
            <a href="{{ '/' | relative_url }}" class="topnav-link {% if page.navbar_title == 'About Me' %}active{% endif %}">Home</a>
            <a href="{{ '/publications' | relative_url }}" class="topnav-link {% if page.navbar_title == 'Publications' %}active{% endif %}">Publications</a>
            <a href="{{ '/talks' | relative_url }}" class="topnav-link {% if page.navbar_title == 'Talks' %}active{% endif %}">Talks</a>
            <a href="{{ '/honors' | relative_url }}" class="topnav-link {% if page.navbar_title == 'Honors' %}active{% endif %}">Honors &amp; Services</a>
            <a href="{{ '/software' | relative_url }}" class="topnav-link {% if page.navbar_title == 'Software' %}active{% endif %}">Software</a>
            <a href="{{ '/life' | relative_url }}" class="topnav-link {% if page.navbar_title == 'About' %}active{% endif %}">Life</a>
        </nav>
    </div>
</header>

<!-- Main content -->
<main class="topnav-main">
    {% if page.page_title %}
    <h1 class="page-title" style="font-family: var(--font-heading); font-weight: 600; font-size: 2.1rem; margin: 1rem 0 2rem; letter-spacing: -0.01em;">{{ page.page_title }}</h1>
    {% endif %}
    {{ content }}
    {% include footer.html %}
</main>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/jquery.lazy/1.7.9/jquery.lazy.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.min.js" integrity="sha512-XKa9Hemdy1Ui3KSGgJdgMyYlUg1gM+QhL6cnlyTe2qzMCYm4nAZ1PsVerQzTTXzonUR+dmswHqgJPuwCq1MaAg==" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/github-buttons/2.14.2/buttons.min.js" integrity="sha512-OYwZx04hKFeFNYrWxIyo3atgGpb+cxU0ENWBZs72X7T9U+NoHPM1ftUn/Mfw7dRDXrqWA6M1wBg6z6fGE32aeA==" crossorigin="anonymous"></script>
<script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
<script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
          delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
          ],
          throwOnError : false
        });
    });
</script>
<script src="{{ '/assets/js/common.js' | relative_url }}"></script>
<script src="{{ '/assets/js/bubble_visual_hash.js' | relative_url }}"></script>
<script src="{{ '/assets/js/google_scholar_citation_count.js' | relative_url }}"></script>
<script src="{{ '/assets/js/read_more.js' | relative_url }}"></script>
</body>
</html>
