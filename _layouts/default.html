    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
              delimiters: [
                  {left: '$$', right: '$$', display: true},
                  {left: '$', right: '$', display: false}
              ],
              throwOnError : false
            });
        });
    </script>
    <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/bubble_visual_hash.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/google_scholar_citation_count.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/read_more.js' | relative_url }}"></script>
    <!-- Fade-in-up animation observer -->
    <script>
    (function() {
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry, index) {
                if (entry.isIntersecting) {
                    // Add a staggered delay based on the element's position
                    var delay = Array.prototype.indexOf.call(
                        document.querySelectorAll('.fade-in-up'),
                        entry.target
                    ) * 100;
                    setTimeout(function() {
                        entry.target.classList.add('is-visible');
                    }, Math.min(delay, 400));
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in-up').forEach(function(el) {
            observer.observe(el);
        });
    })();
    </script>
</body>
