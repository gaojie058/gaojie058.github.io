<footer class="footer footer-enhanced py-3 mt-5 small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row mb-2">
            <div class="col text-center">
                <a href="#" class="back-to-top" title="Back to top">
                    <i class="fas fa-chevron-up"></i>
                </a>
            </div>
        </div>
        <div class="row my-2">
            <div class="col text-center">
                <div class="text-muted">
                    <i>Last updated: {{ "now" | date: "%b %Y" }}</i>
                </div>
            </div>
        </div>
        {% if site.data.display.footer_text %}
        <div class="row my-2">
            <div class="col text-center">
                <div class="text-muted">
                    {{ site.data.display.footer_text }}
                </div>
            </div>
        </div>
        {% endif %}
    </div>
</footer>
<script>
document.querySelector('.back-to-top').addEventListener('click', function(e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
