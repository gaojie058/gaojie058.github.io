<footer class="footer footer-enhanced py-1 mt-3 small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-1">
            <div class="col text-center">
                <div class="text-muted">
                    <i>Last updated: {{ "now" | date: "%b %Y" }}</i>
                    <br>
                    <span style="font-size: 0.85em;">I updated my website using <a href="https://openclaw.ai" target="_blank" style="color: inherit; text-decoration: underline;">OpenClaw</a> proudly 🐾</span>
                </div>
            </div>
        </div>
        {% if site.data.display.footer_text %}
        <div class="row my-1">
            <div class="col text-center">
                <div class="text-muted">
                    {{ site.data.display.footer_text }}
                </div>
            </div>
        </div>
        {% endif %}
    </div>
</footer>
