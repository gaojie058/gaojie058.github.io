<footer class="footer footer-enhanced py-2 mt-4 small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-1">
            <div class="col text-left">
                <div class="text-muted" style="font-size: 0.78rem;">
                    <i>Last updated: {{ "now" | date: "%b %Y" }}</i>
                </div>
            </div>
            <div class="col text-right">
                <div class="text-muted" style="font-size: 0.78rem;">
                    Updated my website using <a href="https://openclaw.ai" target="_blank" style="color: inherit; text-decoration: underline;">OpenClaw</a> proudly 🐾
                </div>
            </div>
        </div>
        {% if site.data.display.footer_text %}
        <div class="row my-1">
            <div class="col text-center">
                <div class="text-muted">
                    {{ site.data.display.footer_text }}
                </div>
            </div>
        </div>
        {% endif %}
    </div>
</footer>
