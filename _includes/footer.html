<footer class="footer footer-enhanced py-3 mt-2 small">
    <div>
        <div class="text-center text-muted" style="font-size: 0.78rem;">
            Updated my website using <a href="https://claude.com/claude-code" target="_blank" style="color: inherit; text-decoration: underline;">Claude Code</a> proudly 🐾
        </div>
        <div class="text-center text-muted mt-1" style="font-size: 0.72rem; font-style: italic;">
            Last updated: {{ "now" | date: "%b %Y" }}
        </div>
        {% if site.data.display.footer_text %}
        <div class="text-center text-muted mt-1">
            {{ site.data.display.footer_text }}
        </div>
        {% endif %}
    </div>
</footer>
