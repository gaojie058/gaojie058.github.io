<footer class="footer footer-enhanced py-3 mt-4 small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="text-center text-muted" style="font-size: 0.78rem;">
            Updated my website using <a href="https://openclaw.ai" target="_blank" style="color: inherit; text-decoration: underline;">OpenClaw</a> proudly 🐾
        </div>
        <div class="text-center text-muted mt-1" style="font-size: 0.72rem; font-style: italic;">
            Last updated: {{ "now" | date: "%b %Y" }}
        </div>
        {% if site.data.display.footer_text %}
        <div class="text-center text-muted mt-1">
            {{ site.data.display.footer_text }}
        </div>
        {% endif %}
    </div>
</footer>
