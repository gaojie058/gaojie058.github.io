# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "Academic Homepage" # Your site title
description: "Personal academic website" # Your site description
url: "https://gaojie058.github.io" # Your GitHub Pages URL
baseurl: "" # the subpath of your site, e.g. /blog

# GitHub Pages specific settings
repository: "gaojie058/gaojie058.github.io"

# Build settings
markdown: kramdown
plugins:
  - jekyll-email-protect

# Exclude from processing.
# `brainstorming/` holds design notes that quote Liquid tags such as {% raw %}{% include ... %}{% endraw %};
# without this, `jekyll build` dies trying to execute them. The folder is gitignored,
# so this only affects local builds.
# Setting this key REPLACES Jekyll's built-in exclude list rather than adding to
# it, so the defaults have to be restated below or they are lost.
exclude:
  - brainstorming/
  # A source-only note. Without this, Jekyll renders it into a stray unstyled
  # page at /assets/images/monash/CREDITS.html.
  - assets/images/monash/CREDITS.md
  # Jekyll's defaults, restated. `vendor/` matters on CI: ruby/setup-ruby with
  # bundler-cache installs gems into ./vendor/bundle, and unexcluded Jekyll walks
  # into them and dies on jekyll-3.10.0's undated site_template ERB post.
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# timezone: Asia/Shanghai

collections:
  - publications
  - life
  - software
